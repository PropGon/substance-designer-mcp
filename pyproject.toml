[project]
name = "substance-designer-mcp"
version = "0.1.0"
description = "Servidor MCP para Adobe Substance 3D Designer y sus herramientas sbscooker/sbsrender"
authors = [{ name = "PropGon", email = "tools@propgon.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
substance-designer-mcp = "substance_designer_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substance_designer_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["designer_plugin/sd_mcp_bridge"]
